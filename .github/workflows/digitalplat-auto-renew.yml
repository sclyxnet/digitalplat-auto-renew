name: DigitalPlat Auto Renew

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run renewal check
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
          DIGITALPLAT_DOMAINS: ${{ secrets.DIGITALPLAT_DOMAINS }}
          DIGITALPLAT_API_BASE: ${{ vars.DIGITALPLAT_API_BASE }}
          DIGITALPLAT_RENEW_BEFORE_DAYS: ${{ vars.DIGITALPLAT_RENEW_BEFORE_DAYS }}
          DIGITALPLAT_RENEWAL_TYPE: ${{ vars.DIGITALPLAT_RENEWAL_TYPE }}
          DIGITALPLAT_RENEWAL_YEARS: ${{ vars.DIGITALPLAT_RENEWAL_YEARS }}
        run: |
          # Mask each managed domain so it never appears in logs.
          # DIGITALPLAT_DOMAINS is a secret, but GitHub only masks the whole
          # string; individual domain names printed by the script also need
          # ::add-mask:: to be redacted.
          while IFS= read -r domain; do
            [ -n "$domain" ] && echo "::add-mask::$domain"
          done < <(printf '%s\n' "$DIGITALPLAT_DOMAINS" | tr ',' '\n')
          python scripts/digitalplat_auto_renew.py

      - name: Keepalive
        run: |
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keepalive $(date -u +%Y-%m-%d)"
            git push
